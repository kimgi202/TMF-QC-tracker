<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMF QC Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f7f7f5;color:#37352f;padding:2rem 1rem;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto}
  .title{font-size:26px;font-weight:700;margin-bottom:4px}
  .sub{font-size:14px;color:#787774;margin-bottom:1.25rem}
  .stats{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid #e9e9e7;border-radius:8px;padding:10px 16px;flex:1;min-width:80px}
  .stat-num{font-size:22px;font-weight:600}
  .stat-label{font-size:11px;color:#787774;margin-top:2px}
  .progress-bar{height:4px;background:#e9e9e7;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:4px;background:#0f7b6c;border-radius:2px;transition:width .3s}
  .section{margin-bottom:1rem;background:#fff;border:1px solid #e9e9e7;border-radius:8px;overflow:hidden}
  .sec-header{padding:11px 16px;background:#f7f7f5;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .sec-title{font-size:14px;font-weight:600;flex:1}
  .sec-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:8px 14px;text-align:left;font-weight:500;color:#787774;border-bottom:1px solid #e9e9e7;white-space:nowrap;font-size:12px;background:#fafafa}
  td{padding:9px 14px;border-bottom:1px solid #f0f0ef;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f7f7f5}
  select.status-sel{font-size:12px;padding:3px 8px;border-radius:20px;border:none;cursor:pointer;font-weight:500;outline:none;appearance:none;-webkit-appearance:none}
  .s-ok{background:#e6f4ea;color:#1e6e3e}
  .s-issue{background:#fce8e8;color:#8b1a1a}
  .s-wip{background:#fef3e2;color:#7a4b00}
  .s-na{background:#f0f0ef;color:#787774}
  .s-pend{background:#ede9fe;color:#4a3896}
  .note-input{font-size:13px;border:none;background:transparent;color:#37352f;width:100%;font-family:inherit;outline:none;padding:0}
  .note-input::placeholder{color:#c7c7c5}
  .chevron{color:#999;font-size:12px;transition:transform .2s;display:inline-block}
  .chevron.open{transform:rotate(90deg)}
  .footer{text-align:center;font-size:12px;color:#bbb;margin-top:2rem}
  .export-btn{margin-top:1rem;width:100%;padding:10px;font-size:13px;color:#787774;border:1px solid #e9e9e7;border-radius:8px;background:#fff;cursor:pointer}
  .export-btn:hover{background:#f7f7f5}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">📋 TMF QC Tracker</div>
  <div class="sub">문서 종류별 QC 상태 관리 — 마지막 업데이트: <span id="lastUpdated">-</span></div>
  <div class="stats" id="stats"></div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div id="sections"></div>
  <button class="export-btn" onclick="exportCSV()">📥 현황 CSV 내보내기</button>
  <div class="footer">TMF QC Tracker · 김민지 CRA</div>
</div>

<script>
const sections = [
  {
    title: "📁 필수 문서 (Essential Documents)",
    docs: [
      "프로토콜 (최신 버전)",
      "IB (Investigator's Brochure) 최신본",
      "동의서 (최신 승인본)",
      "IRB 승인서",
      "연구자 CV / GCP 이수증",
      "IRB 위원 명단",
      "임상시험 신청서 (IND)",
    ]
  },
  {
    title: "📋 IRB 제출 서류",
    docs: [
      "초기심의 승인서",
      "변경보고 승인서",
      "중간보고 접수증",
      "종료보고 접수증",
      "재동의 면제 승인서 (해당 시)",
    ]
  },
  {
    title: "✍️ 동의서 관련",
    docs: [
      "버전별 동의서 원본",
      "대상자별 동의서 체크",
      "재동의 완료 여부 확인",
      "동의서 보관 여부 확인",
    ]
  },
  {
    title: "🔍 모니터링 관련",
    docs: [
      "MVR (모니터링 방문 보고서)",
      "SIVR (Site Initiation Visit Report)",
      "Close-out Visit Report",
      "방문 일지 / 로그",
    ]
  },
  {
    title: "💊 시험약 관련",
    docs: [
      "제품설명서 최신본",
      "첨부문서 최신본",
      "약물 수령/불출 기록",
      "반납/폐기 기록",
    ]
  },
  {
    title: "📊 데이터 / CRF",
    docs: [
      "eCRF 최신 버전 적용 여부",
      "Query 해결 현황",
      "SAE 보고 여부 확인",
      "데이터 락 여부",
    ]
  }
];

const statuses = [
  {val:"ok",    label:"✓ 완료",  cls:"s-ok"},
  {val:"wip",   label:"진행중",  cls:"s-wip"},
  {val:"issue", label:"❌ 이슈", cls:"s-issue"},
  {val:"pend",  label:"미제출",  cls:"s-pend"},
  {val:"na",    label:"N/A",     cls:"s-na"},
];

let state = JSON.parse(localStorage.getItem('tmf-qc-state') || '{}');
let collapsed = {};

function save(){
  localStorage.setItem('tmf-qc-state', JSON.stringify(state));
  document.getElementById('lastUpdated').textContent = new Date().toLocaleString('ko-KR');
}

function getStatus(si,di){ return state[si+'-'+di]?.status || 'pend'; }
function getNote(si,di){   return state[si+'-'+di]?.note   || ''; }

function setStatus(si,di,v){
  if(!state[si+'-'+di]) state[si+'-'+di]={};
  state[si+'-'+di].status = v;
  save(); renderStats();
  const sel = document.getElementById('sel-'+si+'-'+di);
  if(sel){ sel.className = 'status-sel ' + statuses.find(s=>s.val===v).cls; }
  const badge = document.getElementById('badge-'+si);
  if(badge){ updateBadge(si, badge); }
}

function setNote(si,di,v){
  if(!state[si+'-'+di]) state[si+'-'+di]={};
  state[si+'-'+di].note = v;
  save();
}

function updateBadge(si, badge){
  let done=0;
  sections[si].docs.forEach((_,di)=>{ if(getStatus(si,di)==='ok') done++; });
  const total = sections[si].docs.length;
  const cls = done===total ? 's-ok' : done>0 ? 's-wip' : 's-pend';
  badge.className = 'sec-badge ' + cls;
  badge.textContent = done+'/'+total;
}

function renderStats(){
  let total=0,ok=0,issue=0,wip=0;
  sections.forEach((s,si)=>s.docs.forEach((_,di)=>{
    total++;
    const st=getStatus(si,di);
    if(st==='ok') ok++;
    else if(st==='issue') issue++;
    else if(st==='wip') wip++;
  }));
  const pct = Math.round(ok/total*100);
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">전체 문서</div></div>
    <div class="stat"><div class="stat-num" style="color:#0f7b6c">${ok}</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-num" style="color:#b87500">${wip}</div><div class="stat-label">진행중</div></div>
    <div class="stat"><div class="stat-num" style="color:#a33">${issue}</div><div class="stat-label">이슈</div></div>
    <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-label">완료율</div></div>
  `;
  document.getElementById('prog').style.width = pct+'%';
}

function render(){
  const sec = document.getElementById('sections');
  sec.innerHTML = '';
  sections.forEach((s,si)=>{
    const isOpen = !collapsed[si];
    let done=0;
    s.docs.forEach((_,di)=>{ if(getStatus(si,di)==='ok') done++; });
    const total = s.docs.length;
    const badgeCls = done===total?'s-ok':done>0?'s-wip':'s-pend';

    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `
      <div class="sec-header" onclick="toggleSec(${si})">
        <span class="chevron ${isOpen?'open':''}">▶</span>
        <span class="sec-title">${s.title}</span>
        <span id="badge-${si}" class="sec-badge ${badgeCls}">${done}/${total}</span>
      </div>
      ${isOpen ? `<div class="table-wrap"><table>
        <thead><tr>
          <th style="width:42%">문서명</th>
          <th style="width:18%">QC 상태</th>
          <th>비고</th>
        </tr></thead>
        <tbody>${s.docs.map((doc,di)=>`
          <tr>
            <td>${doc}</td>
            <td><select id="sel-${si}-${di}" class="status-sel ${statuses.find(s=>s.val===getStatus(si,di)).cls}"
              onchange="setStatus(${si},${di},this.value)">
              ${statuses.map(st=>`<option value="${st.val}" ${getStatus(si,di)===st.val?'selected':''}>${st.label}</option>`).join('')}
            </select></td>
            <td><input class="note-input" placeholder="메모 입력" value="${getNote(si,di).replace(/"/g,'&quot;')}"
              onchange="setNote(${si},${di},this.value)"></td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : ''}
    `;
    sec.appendChild(div);
  });
  renderStats();
}

function toggleSec(si){ collapsed[si]=!collapsed[si]; render(); }

function exportCSV(){
  let csv = '\uFEFF문서명,카테고리,QC 상태,비고\n';
  sections.forEach((s,si)=>{
    s.docs.forEach((doc,di)=>{
      const st = statuses.find(x=>x.val===getStatus(si,di))?.label || '';
      const note = getNote(si,di).replace(/,/g,' ');
      csv += `"${doc}","${s.title}","${st}","${note}"\n`;
    });
  });
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'TMF_QC_Tracker_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// init
const saved = localStorage.getItem('tmf-qc-lastUpdated');
if(saved) document.getElementById('lastUpdated').textContent = saved;
render();
</script>
</body>
</html>
